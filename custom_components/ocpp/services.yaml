# Service ID
add_user:
  name: Add OCPP user
  description: Adds a managed OCPP user and creates the corresponding user energy entity.
  fields:
    name:
      name: Name
      description: User display name.
      required: true
      example: "Daniel"
    id_tag:
      name: OCPP idTag
      description: One or more OCPP idTags. Separate multiple tags with commas.
      required: true
      example: "FBC7270B"
    active:
      name: Active
      description: Whether this user is allowed to charge.
      required: false
      default: true
      example: true

update_user:
  name: Update OCPP user
  description: Updates a managed OCPP user found by one assigned idTag.
  fields:
    id_tag:
      name: Existing OCPP idTag
      description: Existing idTag of the user to update.
      required: true
      example: "FBC7270B"
    name:
      name: Name
      description: New user display name.
      required: false
      example: "Daniel"
    new_id_tags:
      name: New OCPP idTags
      description: Replacement idTags. Separate multiple tags with commas.
      required: false
      example: "FBC7270B, AABBCCDD"
    active:
      name: Active
      description: Whether this user is allowed to charge.
      required: false
      example: true

set_user_active:
  name: Set OCPP user active state
  description: Activates or deactivates a managed OCPP user found by idTag.
  fields:
    id_tag:
      name: OCPP idTag
      description: Existing idTag of the user.
      required: true
      example: "FBC7270B"
    active:
      name: Active
      description: Whether this user is allowed to charge.
      required: true
      example: false

set_charge_rate:
  # Service name as shown in UI
  name: Set maximum charge rate
  # Description of the service
  description: Sets the maximum charge rate in Amps or Watts (dependent on charger support)
  # If the service accepts entity IDs, target allows the user to specify entities by entity, device, or area. If `target` is specified, `entity_id` should not be defined in the `fields` map. By default it shows only targets matching entities from the same domain as the service, but if further customization is required, target supports the entity, device, and area selectors (https://www.home-assistant.io/docs/blueprint/selectors/). Entity selector parameters will automatically be applied to device and area, and device selector parameters will automatically be applied to area. 
  #target:
  #   entity:
  #     integration: ocpp
  # Different fields that your service accepts
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    # Key of the field
    limit_amps:
      # Field name as shown in UI
      name: Limit (A)
      # Description of the field
      description: Maximum charge rate in Amps (optional)
      # Whether or not field is required (default = false)
      required: false
      # Advanced fields are only shown when the advanced mode is enabled for the user (default = false)
      advanced: false
      # Example value that can be passed for this field
      example: 16
      # The default field value
      default: 32
    limit_watts:
      name: Limit (W)
      description: Maximum charge rate in Watts (optional)
      required: false
      advanced: true
      example: 1500
      default: 22000
    conn_id:
      name: Connector identifier 
      description: Optional, 0 = all connectors (default), 1 is first connector
      required: false
      advanced: true
      example: 0
      default: 0
    custom_profile:
      name: Custom profile
      description: Used to send a custom charge profile to charger (for advanced users only use >- or '' to ensure profile is a string variable)
      required: false
      advanced: true
      example: '{"chargingProfileId":8,"stackLevel":0,"chargingProfileKind":"Relative","chargingProfilePurpose":"ChargePointMaxProfile","chargingSchedule":{"chargingRateUnit":"A","chargingSchedulePeriod":[{"startPeriod":0,"limit":16}]}}'

clear_profile:
  name: Clear charging profiles
  description: Clears all charging profiles (limits) set (dependent on charger support)
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"

update_firmware:
  name: Update charger firmware
  description: Specify server to download firmware and time to delay updating (dependent on charger support), supported transfer protocols can be requested by the configuration key SupportedFileTransferProtocols
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    firmware_url:
      name: Url of firmware
      description: Full url of firmware file (http or https)
      required: true
      advanced: true
      example: "http://www.charger.com/firmware.bin"
    delay_hours:
      name: Delay hours
      description: Hours to delay charger update
      required: false
      advanced: true
      example: 12
      default: 0
      
configure:
  name: Configure charger features
  description: Change supported Ocpp v1.6 configuration values
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    ocpp_key:
      name: Configuration key name 
      description: Write-enabled key name supported 
      required: true
      advanced: true
      example: "WebSocketPingInterval"
    value:
      name: Key value
      description: Value to write to key
      required: true
      advanced: true
      example: "60"
      
get_configuration:
  name: Get configuration values for charger
  description: Change supported Ocpp v1.6 configuration values
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    ocpp_key:
      name: Configuration key name 
      description: Key name supported 
      required: true
      advanced: true
      example: "WebSocketPingInterval"
      
get_diagnostics:
  name: Request diagnostic data from charger
  description: Specify server url to upload diagnostic data to (dependent on charger support), supported transfer protocols can be requested by the configuration key SupportedFileTransferProtocols
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    upload_url:
      name: Url for upload
      description: Full url to upload to
      required: true
      advanced: true
      example: "https://webhook.site/abc"
      
data_transfer:
  name: Request data transfer from charger
  description: Note this is specific to charger, see manufacturer's documentation
  fields:
    cpid:
      name: Wallbox ID
      description: Required when more than one OCPP wallbox is connected.
      required: false
      example: "charger_garage"
    vendor_id:
      name: vendorId
      description: Defined by charger manufacturer
      required: true
      advanced: true
      example: "ABC"
    message_id:
      name: messageId
      description: Defined by charger manufacturer
      required: false
      advanced: true
      example: "ABC"
    data:
      name: data
      description: Defined by charger manufacturer
      required: false
      advanced: true
      example: "ABC"
