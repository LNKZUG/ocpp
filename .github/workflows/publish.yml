name: Publish

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release_zip_file:
    name: Publish zip file asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.x"

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@master

      - name: Set version number
        run: |
          version="${{ steps.version.outputs.version }}"
          python3 ${{ github.workspace }}/manage/update_manifest.py --version "${version#v}"

      - name: Upload zip to action
        uses: actions/upload-artifact@v4.3.3
        if: ${{ github.event_name == 'push' }}
        with:
          name: ocpp
          path: ${{ github.workspace }}/custom_components/ocpp
          retention-days: 1

      - name: ZIP dir
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          cd ${{ github.workspace }}/custom_components/ocpp
          zip ocpp.zip -r ./

      - name: Build release notes
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v version="$version" '
            /^## / {
              if (capture) {
                exit
              }
              capture = ($2 == version)
            }
            capture {
              print
            }
          ' RELEASE_NOTES.md > release_body.md
          if [ ! -s release_body.md ]; then
            printf "See RELEASE_NOTES.md for release details.\n" > release_body.md
          fi

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        with:
          body_path: ${{ github.workspace }}/release_body.md
          files: ${{ github.workspace }}/custom_components/ocpp/ocpp.zip

      - name: Backfill release notes
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          with open("RELEASE_NOTES.md", encoding="utf-8") as handle:
              notes = handle.read()

          headers = list(
              re.finditer(r"^##\s+(v\d+\.\d+(?:\.\d+)+)\b.*$", notes, re.MULTILINE)
          )

          def request(method, url, payload=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          for index, match in enumerate(headers):
              tag = match.group(1)
              body_start = match.start()
              body_end = headers[index + 1].start() if index + 1 < len(headers) else len(notes)
              body = notes[body_start:body_end].strip() + "\n"
              try:
                  release = request(
                      "GET",
                      f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
                  )
                  request(
                      "PATCH",
                      f"https://api.github.com/repos/{repo}/releases/{release['id']}",
                      {"body": body},
                  )
                  print(f"Updated release notes for {tag}")
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      print(f"Skipping {tag}: release does not exist")
                      continue
                  raise
          PY
